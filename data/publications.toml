# Research entries shown on the website.
#
# To add a paper, copy one [[paper]] block, paste it at the top of its section
# (newest first) and edit the values. Then run:  python3 build.py
#
# Fields
#   title     required. Simple HTML is allowed, e.g. Top-<i>k</i>
#   authors   required. Full names in order. Put * after a name for equal
#             contribution, e.g. "Soham Mallick*". Your own name is bolded and
#             coauthors listed in people.toml are linked automatically.
#   year      required.
#   section   required. One of the ids in `sections` below.
#   venue     optional. Journal or conference, shown in italics.
#   arxiv     optional. The arXiv number, shown as "arXiv:2505.19371".
#   links     optional. Label = "address" pairs, shown in this order.
#             The title links to the first one.

# Sections appear in this order. Empty sections are not shown.
sections = [
  { id = "paper", title = "Publications" },
  { id = "preprint", title = "Preprints/Submitted Articles" },
  { id = "project", title = "Projects" },
]

