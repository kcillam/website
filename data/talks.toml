# Talks shown on the website, newest first.
#
# To add a talk, copy one [[talk]] block to the top and edit it. Then run:  python3 build.py
#
# Fields
#   title        required.
#   date         required. Shown as written, e.g. "Jul ’23".
#   description  optional. Simple HTML is allowed, e.g. <em>…</em>
#   venue        optional. One place, shown in italics.
#   venues       optional. Several places, shown as a numbered list.
#   links        optional. Label = "address" pairs, e.g. Slides, Abstract, Video.

